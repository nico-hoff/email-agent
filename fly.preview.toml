# Short-lived preview app, see docs/github-environments.md and .github/workflows/preview-app.yml.
# The workflow passes the real name with `--app email-agent-preview-<suffix>`; `app` below is only a placeholder.
# Synthetic data only: no volume (the database lives on the Machine's disk and is re-seeded on every start),
# no accounts file (so no IMAP worker runs), password login with APP_PASSWORD from the GitHub environment `preview`.
# Secrets are never written here.
app = 'email-agent-preview'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'fly'

[env]
  BIND_ADDRESS = '0.0.0.0'
  DATABASE_PATH = '/data/email-agent.sqlite'
  # Opt-in for scripts/docker-entrypoint.sh: fill an empty database with the built-in synthetic set. Never set in fly.toml.
  PREVIEW_SEED_SYNTHETIC = '1'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
