# fly.io deployment, see docs/fly-deploy.md. AUTH_MODE=users: login with user accounts (create the first admin with `npm run user:create`).
# Secrets (APP_PASSWORD, OPENROUTER_API_KEY, accounts) are never written here; use `fly secrets set`.
app = 'email-agent'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'fly'

[env]
  AUTH_MODE = 'users'
  # fly's proxy terminates TLS and sets X-Forwarded-Proto itself; without this Veryfront names the CSRF cookie for
  # http://<app> and every POST from the https page fails with 403 (docs/veryfront-guide.md, Fallstricke).
  VERYFRONT_TRUST_FORWARDED_HEADERS = '1'
  BIND_ADDRESS = '0.0.0.0'
  DATABASE_PATH = '/data/email-agent.sqlite'

[mounts]
  source = 'email_data'
  destination = '/data'

# One machine that never stops: it holds the IMAP IDLE connections and runs the automatic actions.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
