name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --test-reporter=spec tests/*.test.ts
      - run: npm run build
      # Offline gate (T27): stored Jev verdicts of the synthetic sets vs. expected values; no secrets, no model call.
      - run: npm run eval
