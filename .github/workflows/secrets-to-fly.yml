# Secrets aus dem GitHub-Environment `prod` nach fly (ADR 0024). Nur manuell; Freigabe durch den Required reviewer.
# Werte gehen nur über die Umgebung des Schritts und per stdin an `fly secrets import`; im Log stehen nur Namen.
name: Secrets nach fly (prod)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "true = nur vormerken (kein Neustart, wirkt beim nächsten Deploy)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: secrets-to-fly-prod
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Pinned to the commit of tag 1.6; flyctl version pinned as well.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.5.1
      - name: Secrets synchronisieren (nur Namen im Log)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACCOUNTS_ENCRYPTION_KEY: ${{ secrets.ACCOUNTS_ENCRYPTION_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FLY_BIN: fly
          STAGE: ${{ inputs.stage }}
        run: |
          if [ "$STAGE" = "true" ]; then
            node scripts/fly-secrets.ts sync --from-env --profile prod --stage --force
          else
            node scripts/fly-secrets.ts sync --from-env --profile prod --force
          fi
